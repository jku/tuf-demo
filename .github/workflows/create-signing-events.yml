name: TUF-on-CI create Signing events

on:
  schedule:
    - cron:  '17 1,7,13,19 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  create-signing-events:
    runs-on: ubuntu-latest
    # permissions:
      # contents: 'write' # for committing to signing event branch (not needed if using GitHub App)
      # actions: 'write' # for dispatching signing event workflow (not needed if using GitHub App)
    steps:
      - name: Create GitHub App token
        id: app-token
        if: vars.TUF_ON_CI_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TUF_ON_CI_APP_ID }}
          private-key: ${{ secrets.TUF_ON_CI_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Create signing events for offline version bumps
        uses: theupdateframework/tuf-on-ci/actions/create-signing-events@main
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

  update-issue:
    runs-on: ubuntu-latest
    needs: [create-signing-events]
    if: always() && !cancelled()
    permissions:
      issues: 'write' # for modifying Issues
      contents: 'read' # for checking out the repository
    steps:
      - name: Update the issue for the workflow
        uses: theupdateframework/tuf-on-ci/actions/update-issue@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          success: ${{ !contains(needs.*.result, 'failure') }}
