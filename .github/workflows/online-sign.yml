name: TUF-on-CI online signing

permissions: {}

on:
  schedule:
    - cron:  '17 1,7,13,19 * * *'
  push:
    branches: [ main ]
    paths: ['metadata/**', '!metadata/timestamp.json', '!metadata/snapshot.json']
  workflow_dispatch:

jobs:
  online-sign:
    runs-on: ubuntu-latest
    permissions:
      id-token: 'write' # for OIDC identity access
      # contents: 'write' # for committing snapshot/timestamp changes (not needed if using GitHub App)
      # actions: 'write' # for dispatching publish workflow (not needed if using GitHub App)
    steps:
      - name: Create GitHub App token
        id: app-token
        if: vars.TUF_ON_CI_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TUF_ON_CI_APP_ID }}
          private-key: ${{ secrets.TUF_ON_CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-actions: write

      - id: online-sign
        uses: theupdateframework/tuf-on-ci/actions/online-sign@main
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          gcp_workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}


  update-issue:
    runs-on: ubuntu-latest
    needs: [online-sign]
    if: always() && !cancelled()
    permissions:
      issues: 'write' # for modifying Issues
      contents: 'read' # for checking out the repository
    steps:
      - name: Update the issue for the workflow
        uses: theupdateframework/tuf-on-ci/actions/update-issue@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          success: ${{ !contains(needs.*.result, 'failure') }}
